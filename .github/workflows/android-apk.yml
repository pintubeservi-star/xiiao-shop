name: Build Cotuí Go Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - cotui-go-rider-experience
    paths:
      - "package.json"
      - "capacitor.config.ts"
      - "capacitor/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Capacitor configuration and web placeholder
        run: |
          test -f capacitor/www/index.html
          npx cap doctor

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android permissions and app label
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's#<manifest #<manifest xmlns:tools="http://schemas.android.com/tools" #' "$MANIFEST"
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <application#' "$MANIFEST"
          STRINGS="android/app/src/main/res/values/strings.xml"
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">Cotuí Go</string>#' "$STRINGS"

      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cotui-go-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
