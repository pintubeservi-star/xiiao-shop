name: Cotuí Go Android APK
on:
  workflow_dispatch:
  push:
    branches: [cotui-go-native, cotui-go-packages]
    paths:
      - "mobile/**"
      - ".github/workflows/cotui-go-native-apk.yml"
permissions:
  contents: read
jobs:
  build-apk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: business
            artifact: cotui-go-negocios-apk
          - variant: delivery
            artifact: cotui-go-delivery-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: TypeScript validation
        working-directory: mobile
        run: npx tsc --noEmit
      - name: Generate native Android project
        working-directory: mobile
        env:
          APP_VARIANT: ${{ matrix.variant }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo prebuild --platform android --non-interactive
      - name: Bundle JavaScript inside the debug APK
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          source = path.read_text()
          if "debuggableVariants = []" not in source:
              if "react {" not in source:
                  raise SystemExit("No se encontró el bloque react {} en build.gradle")
              source = source.replace("react {", "react {" + chr(10) + "    debuggableVariants = []", 1)
              path.write_text(source)
          PY
      - name: Build debug APK
        working-directory: mobile/android
        env:
          APP_VARIANT: ${{ matrix.variant }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
